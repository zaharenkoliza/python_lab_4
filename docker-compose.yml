name: asyncstand
services:
  db:
    image: postgres:16.4
    environment: {POSTGRES_USER: bench, POSTGRES_PASSWORD: bench, POSTGRES_DB: bench}
    volumes: ["./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=256MB", "-c", "fsync=off"]
    deploy: {resources: {limits: {cpus: "2", memory: 1g}}}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 2s
      retries: 30

  sut:
    build: ./sut
    image: asyncstand-sut:1
    container_name: asyncstand-sut
    environment:
      DRIVER: ${DRIVER:-async_asyncpg}
      POOL_SIZE: ${POOL_SIZE:-20}
    deploy: {resources: {limits: {cpus: "1", memory: 512m}}}   # узкое место - всегда SUT
    ports: ["127.0.0.1:8000:8000"]
    depends_on: {db: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8000/health')"]
      interval: 1s
      retries: 60

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: ["monitoring"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["monitoring"]
    volumes: ["./monitoring/grafana:/etc/grafana/provisioning/datasources:ro"]
    ports: ["127.0.0.1:3000:3000"]

  load:
    image: locustio/locust:2.31.5
    container_name: asyncstand-load
    profiles: ["run"]
    volumes: ["./load:/mnt/locust:ro", "./${RESULTS_DIR:-results/raw}:/results"]
    deploy: {resources: {limits: {cpus: "2", memory: 1g}}}   # генератор не конкурирует с SUT
