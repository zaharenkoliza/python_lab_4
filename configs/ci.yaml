# Сокращённая конфигурация для CI (бонус): проверяет, что весь конвейер проходит от начала до конца
name: ci-smoke
seed: 1
factors:
  driver: [sync_psycopg2, async_asyncpg, async_psycopg3]
  workload: [rows]
  users: [10]
repetitions: 2
warmup_seconds: 2
duration_seconds: 5
randomize_order: true
pool_size: 20
load_cpus: 2              # лимит CPU контейнера генератора (как в docker-compose.yml)
monitoring: false
aa:
  driver: sync_psycopg2
  workload: rows
  users: 10
  repetitions: 4
out_dir: results/ci
